# Cartesian product of fuzzy sets

Note:
Section divider. ≈ 25 min: Cartesian product with a collision-risk example (robot version of the original bookstore exercise).

---

## Problem: collision risk of a mobile robot

Relation between the robot's **speed** and the **distance to the nearest obstacle**:

| Set | Function | Parameters |
|---|---|---|
| A = speed is fast | Sigmoid | a = 12, x₀ = 0.5 |
| B = obstacle is close | Sigmoid | a = −5, y₀ = 1.0 |
| Universe x = [0, 1] | robot speed (m/s) | |
| Universe y = [0, 3] | sonar distance (m) | |

<div class="m">$$ \mu_{A\times B}(x,y) = \min\big(\mu_A(x),\ \mu_B(y)\big) $$</div>

<p class="small">Remember: since it is a <b>relation</b>, the result lives on a 2-D domain → a surface (or a heat-map).</p>

Note:
Read the table aloud. Ask: 'what does a point (x, y) with high μ mean for the robot?' before showing the widget. Original exercise (bookstore: moderate sales × shelf diversity, gbell(20, 3, 50) × sigmoid(0.01, 500)) works as homework with the same code.

---

## Explore the product

<div data-widget="cartesian"></div>

Note:
Hover over different regions. Interpretation: the relation "collision risk" is high only where the robot is fast (> ~0.6 m/s) AND the obstacle is close (< ~0.8 m). Toggle min vs product: product gives a smoother, lower surface.
Ask: "How would a safety supervisor use this map?" — e.g. limit speed whenever the risk exceeds 0.5 (an α-cut of a relation!).

---

## The code

```python [1-7|9-11|13-18]
import numpy as np, skfuzzy as fuzz, matplotlib.pyplot as plt

xA = np.linspace(0, 1, 101)                 # speed (m/s)
xB = np.linspace(0, 3, 301)                 # obstacle distance (m)
mA = fuzz.sigmf(xA, 0.5, 12)                # "fast"   skfuzzy: (x, center, slope)
mB = fuzz.sigmf(xB, 1.0, -5)                # "close"  (negative slope)
def cartesian(a, b): return np.fmin.outer(a, b)

R_AB = cartesian(mA, mB)
A, B = np.meshgrid(xA, xB, indexing='ij')
print(R_AB.shape)                           # (101, 301)

fig = plt.figure()
ax = fig.add_subplot(projection='3d')
ax.plot_surface(A, B, R_AB, cmap=plt.cm.hot)
ax.set_zlim(0, 1)
ax.set_xlabel('speed'); ax.set_ylabel('distance'); ax.set_zlabel('risk')
plt.show()
```

Note:
Students run this in Jupyter. np.fmin.outer replaces the original 'cartesian' helper. Watch out: skfuzzy.sigmf takes (x, center, slope).

# Composition of fuzzy relations

Note:
Section divider. ≈ 25 min: max-min composition.

---

## Max-min composition

<div class="m">$$ (R_1\circ R_2)(x,z) = \max_{y}\ \min\big(R_1(x,y),\ R_2(y,z)\big) $$</div>

<div class="cols">
<div class="card fragment rise"><h4>Like a matrix product…</h4><p>row of R₁ × column of R₂</p></div>
<div class="card fragment rise"><h4>…but with different operators</h4><p>multiply → <b>min</b> · sum → <b>max</b></p></div>
</div>

<p class="fragment rise callout teal" style="margin-top:20px">Meaning: x is related to z as strongly as the <b>strongest chain</b> x → y → z, where each chain is as strong as its <b>weakest link</b>.</p>

Note:
Analogy to matrix product helps a lot. Write one entry by hand on the board before the widget.

---

<div data-widget="composition"></div>

## In Python

```python
import numpy as np

def compose(R1, R2):
    """max-min composition of two fuzzy relations given as matrices."""
    return np.max(np.fmin(R1[:, :, None], R2[None, :, :]), axis=1)

R1 = np.array([[0.4, 1.0, 0.2],
               [0.1, 0.0, 0.5],
               [0.9, 0.7, 0.8]])
R2 = np.array([[1.0, 0.6, 0.5, 0.4, 0.0],
               [0.4, 0.8, 0.7, 0.3, 0.3],
               [0.5, 1.0, 0.5, 0.2, 0.8]])
print(compose(R1, R2))
# [[0.4 0.8 0.7 0.4 0.3]
#  [0.5 0.5 0.5 0.2 0.5]
#  [0.9 0.8 0.7 0.4 0.8]]
```

<p class="small">Challenge: write <code>compose_prod</code> for max-product. Broadcasting does the triple loop for you.</p>

Note:
Broadcasting trick: R1[:, :, None] vs R2[None, :, :] builds all (x, y, z) triples at once. The printed result matches the original slide.

## Composition of a set with a relation

<div class="pipeline">
<div class="blk a1">A(x)</div><div class="arr">×</div><div class="blk a1">B(y)</div><div class="arr">=</div><div class="blk a2">R = A × B</div>
</div>
<div class="pipeline" style="margin-top:14px">
<div class="blk a3">A′(x)</div><div class="arr">∘</div><div class="blk a2">R</div><div class="arr">=</div><div class="blk plant">B′(y) = A′ ∘ R</div>
</div>

<br>

| Set | Function | Parameters |
|---|---|---|
| A(x) | Sigmoid | a = 15, x₀ = 0.5 |
| B(y) | Sigmoid | a = −3, y₀ = 2.5 |
| A′(x) | Gaussian | σ = 0.04, x₀ = 0.5 |
| Universes | x = [0, 1] | y = [1, 5] |

Note:
Same pipeline as GMP, now computed numerically. The table reproduces the parameters of the original exercise.

# Linguistic variables

Note:
Section divider. ≈ 15 min: linguistic variables.

---

## A linguistic variable is a 5-tuple

<div class="m">$$ (x,\ X,\ T(x),\ G,\ M) $$</div>

<div class="cols">
<div>

- $x$ — name / label
- $X$ — universe of discourse
- $T(x)$ — the linguistic values (terms)
- $G$ — syntactic rule that generates the terms
- $M$ — semantic rule: the meaning (MF) of each term

</div>
<div class="card">
<h4>Example: heading error of a mobile robot 🧭</h4>
<p>x: heading error to the goal · X: [−90°, 90°]</p>
<p>T = {hard_left, left, straight, right, hard_right}</p>
<p>M(hard_left) = sigmoid(−0.15, −45)<br>M(left) = gauss(σ 15, −30) · M(straight) = gauss(σ 15, 0) · M(right) = gauss(σ 15, 30)<br>M(hard_right) = sigmoid(0.15, 45)</p>
</div>
</div>

Note:
Explain G with an example: the grammar that generates 'very left', 'more or less straight'… M gives each term an MF. (Original example: ball possession in soccer, same structure.)

# Fuzzy reasoning with IF–THEN rules

Note:
Section divider. ≈ 25 min: the 'obstacle close → brake' rule.

---

## “If the obstacle is close, then brake hard”

| Linguistic value | MF | Universe |
|---|---|---|
| obstacle is close | sigmoid(a = −5, c = 1.0) | x ∈ [0, 3] m (sonar distance) |
| brake hard | sigmoid(a = 10, c = 0.6) | y ∈ [0, 1] normalised brake command |

1. Compute the rule as a relation $R = A\times B$ and plot it.
2. **How do we interpret it?** The rule is strongly “active” only for (short distance, strong braking).

<div class="callout teal fragment rise">Fuzzy modus ponens: &nbsp; Fact x is A′ &nbsp;·&nbsp; Rule R = A × B &nbsp;⇒&nbsp; <b>B′ = A′ ∘ R</b></div>

Note:
Students compute R = A × B in Python (same code as the collision-risk example). Original version of this exercise: 'If I study a lot, I will be an excellent student' — sigmoid(3, 2) on [0, 8] h × sigmoid(3, 8) on [0, 10].

---

## “The sonar reads about 2.5 m” — how hard should we brake?

<div data-widget="gmp" data-x="0,3" data-y="0,1" data-a="sig,-5,1" data-b="sig,10,0.6" data-ap="gauss,2.5,0.15" data-labels="obstacle distance (m)|brake command"></div>

Note:
The fact A′ is a noisy sonar reading: a Gaussian around 2.5 m whose width models the sensor noise. The match with "close" is tiny → "brake hard" is clipped at a very low level.
Move A′ to 0.5 m — the conclusion becomes strong. Widen A′ (a noisier sensor): the match grows earlier — a conservative robot brakes sooner with a bad sensor. Great robotics discussion.
The rule says nothing about what to do when the obstacle is FAR — B′ never says "accelerate". That's a property of Mamdani implication: you need more rules.

---

<!-- .slide: class="checkpoint" data-background-color="#f3effc" -->

<span class="tag violet">Exit ticket</span>

<div class="quiz" data-answer="a">
<p class="q">The obstacle is far (≈ 2.5 m). Using only the rule “IF obstacle is close THEN brake hard”, our fuzzy conclusion B′ is…</p>
<div class="opts one">
<button class="opt" data-k="a">“Brake hard” clipped at a small height — the rule barely applies, so we learn little</button>
<button class="opt" data-k="b">“Accelerate” — the path is clear</button>
<button class="opt" data-k="c">“Brake hard” with full membership</button>
<button class="opt" data-k="d">Undefined — GMP needs A′ = A exactly</button>
</div>
<div class="explain">GMP only <b>propagates</b> the rule to the degree the fact matches the antecedent. To conclude “accelerate” you need another rule (IF far THEN speed up)!</div>
</div>

Note:
Answer A. Stress: a single rule can't conclude the opposite. You need a complete rule base.
