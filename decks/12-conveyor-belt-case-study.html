## Choose inputs, terms and rules

1. Which **inputs** do you need? Is the position error enough?
2. How many **terms** per variable, and over what universe?
3. Write the **rule table**.

<div class="timer" data-seconds="300"></div>

<details><summary>One possible design</summary>
Inputs: error e = target − x ∈ [−1.5, 1.5] m and ball velocity v ∈ [−1, 1] m/s, each with {N, Z, P}. Output: belt velocity {NB, NS, Z, PS, PB} ∈ [−1, 1] m/s. Rules (PD-like): push toward the target; when already moving toward it, push less.</details>

Note:
5 minutes. Collect two different designs and compare them on the board.

## CoppeliaSim + ZMQ remote API

```bash
pip install -U coppeliasim-zmqremoteapi-client
```

```python [1-4|6-12|14-22]
from coppeliasim_zmqremoteapi_client import RemoteAPIClient
client = RemoteAPIClient()                     # CoppeliaSim must be running
sim = client.require('sim')
ball, belt = sim.getObject('/Sphere'), sim.getObject('/ConveyorBelt')

def set_belt_speed(v):
    # The conveyor model reads its velocity from a custom-data table.
    # Check the model script of YOUR CoppeliaSim version, e.g.:
    sim.writeCustomTableData(belt, '__ctrl__', {'vel': v})

target, prev_x, t_prev = 0.6, None, None
sim.setStepping(True); sim.startSimulation()

while sim.getSimulationTime() < 3.0:
    t = sim.getSimulationTime()
    x = sim.getObjectPosition(ball, -1)[0]     # x coordinate of the ball
    v = 0 if prev_x is None else (x - prev_x) / max(t - t_prev, 1e-3)
    u = flc(target - x, v)                     # your fuzzy controller (skfuzzy)
    set_belt_speed(u)
    prev_x, t_prev = x, t
    sim.step()
sim.stopSimulation()
```

Note:
The ZMQ client is the only install needed. Belt-speed API varies by CoppeliaSim version/model (4.10 in the original screenshot); have students open the conveyor's script to find the exact call. Use stepping mode so the controller runs every simulation step.

## Lab deliverables

1. Implement the FLC (skfuzzy `ControlSystem` or your own Mamdani from Session 7).
2. Run targets **0.6, −0.6, 0** from different start positions. Plot $x(t)$.
3. Compare **error-only** vs **error + velocity** rule bases.
4. Tune MFs for settling time ≈ 1.5 s without the ball leaving the belt.
5. *(Bonus)* Train a small ANFIS from logged (e, v) → u data of your best FLC and compare.

<p class="q">Which pair of classical laws does NOT hold for fuzzy sets with min/max/1−μ?</p>
